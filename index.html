<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>池内式 対位法トレーナー</title>
</head>
<body>
<header class="app-header">
  <div class="title-wrap">
    <div class="title-line">
      <h1>対位法トレーナー</h1>
      <span class="version-pill">PWA v1.8</span>
    </div>
    <p>池内式 二声対位法</p>
  </div>
  <button id="updateBtn" class="update" hidden>更新</button>
</header>

<main>
  <section class="card control-card">
    <div class="learning-grid">
      <div>
        <div class="label">定旋律集</div>
        <select id="collectionSelect">
          <option value="trainer">対位法トレーナー練習用定旋律</option>
        </select>
      </div>

      <div>
        <div class="label">旋法</div>
        <select id="modeSelect">
          <option value="major">長旋法</option>
          <option value="minor">短旋法</option>
          <option value="dorian">ドリア旋法</option>
          <option value="phrygian">フリギア旋法</option>
          <option value="lydian">リディア旋法</option>
          <option value="mixolydian">ミクソリディア旋法</option>
          <option value="aeolian">エオリア旋法</option>
        </select>
      </div>

      <div>
        <div class="label">類</div>
        <div class="segmented">
          <button id="mode11Btn" class="segment">第1類（全音符）</button>
          <button id="mode12Btn" class="segment active">第2類（二分音符）</button>
        </div>
      </div>

      <div>
        <div class="label">定旋律を置く声部</div>
        <div class="segmented">
          <button id="cfUpperBtn" class="segment active">上声</button>
          <button id="cfLowerBtn" class="segment">下声</button>
        </div>
      </div>
    </div>

    <div class="challenge-row">
      <div class="problem-box">
        <div class="label">課題</div>
        <div class="problem-nav">
          <button id="prevProblemBtn" aria-label="前の問題">‹</button>
          <select id="problemSelect"></select>
          <button id="nextProblemBtn" aria-label="次の問題">›</button>
        </div>
        <div id="problemCount" class="subtle"></div>
      </div>

      <div class="tempo-control">
        <div class="label">テンポ</div>
        <div class="tempo-row">
          <button id="tempoDownBtn" aria-label="テンポを下げる">−</button>
          <input id="tempoSlider" type="range" min="40" max="160" step="2" value="80">
          <button id="tempoUpBtn" aria-label="テンポを上げる">＋</button>
          <span id="tempoValue" class="tempo-value">♩=80</span>
        </div>
      </div>

      <div class="top-actions">
        <button id="playCantusBtn" class="tool-btn">▶<span>定旋律</span></button>
        <button id="playBothBtn" class="tool-btn">▶▶<span>二声</span></button>
        <button id="stopBtn" class="tool-btn">■<span>停止</span></button>
        <button id="undoBtn" class="tool-btn">↶<span>戻る</span></button>
        <button id="redoBtn" class="tool-btn">↷<span>やり直す</span></button>
        <button id="analyzeBtn" class="tool-btn primary-tool">採点<span>添削</span></button>
      </div>
    </div>
    <p class="source-note">課題選択の構成は、洗足オンライン「地球の旋律線」の学習フローを参考にした独自実装です。</p>
  </section>

  <section class="card score-card">
    <div class="score-title">
      <h2 id="cfTitle">定旋律</h2>
      <span class="badge">全音符・固定</span>
    </div>
    <canvas id="cantusCanvas" aria-label="定旋律"></canvas>

    <div class="score-title cp-title">
      <h2 id="cpTitle">対旋律</h2>
      <span id="selectedPitch" class="badge">未選択</span>
    </div>
    <canvas id="counterCanvas" aria-label="対旋律"></canvas>
  </section>

  <section class="card input-card">
    <h2 id="inputTitle">音の入力（対旋律・二分音符）</h2>
    <div class="input-columns">
      <div>
        <div class="label">音の高さ</div>
        <div id="pitchButtons" class="pitch-grid"></div>
      </div>
      <div>
        <div class="label">臨時記号</div>
        <div class="acc-grid">
          <button id="naturalBtn">♮ ナチュラル</button>
          <button id="sharpBtn">♯ シャープ</button>
          <button id="flatBtn">♭ フラット</button>
        </div>
      </div>
      <div>
        <div class="label">休符</div>
        <button id="restBtn" class="rest-button">𝄽 二分休符</button>
      </div>
    </div>
    <div class="micro-controls">
      <button id="upBtn">↑ 1段上げる</button>
      <button id="downBtn">↓ 1段下げる</button>
      <button id="resetBtn">問題をリセット</button>
      <button id="clearBtn">対旋律を全削除</button>
    </div>
  </section>

  <section class="card feedback-card">
    <div class="feedback-head">
      <h2>添削結果</h2>
      <div class="legend">
        <span><i class="dot good-dot"></i>適切</span>
        <span><i class="dot caution-dot"></i>注意</span>
        <span><i class="dot error-dot"></i>要修正</span>
        <span><i class="dot info-dot"></i>判定保留</span>
      </div>
    </div>
    <div id="results"><p class="muted">「採点・添削」を押すと判定結果が表示されます。</p></div>
    <div id="summaryBadge" class="summary-badge">未判定</div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
